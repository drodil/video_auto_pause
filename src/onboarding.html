<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="onboarding.css" />
    <link rel="stylesheet" href="tooltips.css" />
    <title>Video Auto Pause</title>
  </head>
  <body>
    <main>
      <h1 data-i18n="onboardingTitle">Welcome to Video Auto Pause</h1>
      <p class="intro" data-i18n="onboardingIntro">
        Videos pause when you leave a tab or lock your device, then resume when
        you return.
      </p>
      <section
        class="behaviors"
        aria-label="What the extension does"
        data-i18n-aria-label="onboardingFeatures"
      >
        <article class="behavior">
          <img src="images/icon_32.png" alt="" />
          <p data-i18n="autopause">Pause video when switching tabs</p>
        </article>
        <article class="behavior">
          <img src="images/icon_32.png" alt="" />
          <p data-i18n="scrollpause">Pause video when scrolled out of view</p>
        </article>
        <article class="behavior">
          <img src="images/icon_32.png" alt="" />
          <p data-i18n="lockpause">Pause video when computer is locked</p>
        </article>
      </section>
      <p class="pin-prompt" data-i18n="onboardingPin">
        Pin the extension to your toolbar for quick access.
      </p>
      <section>
        <h2 data-i18n="presetTitle">Choose a mode</h2>
        <div class="onboarding-presets">
          <button
            type="button"
            data-preset="study"
            data-i18n="presetStudy"
            data-i18n-tooltip="presetStudyDescription"
          >
            Study / lectures
          </button>
          <button
            type="button"
            data-preset="music"
            data-i18n="presetMusic"
            data-i18n-tooltip="presetMusicDescription"
          >
            Background music
          </button>
          <button
            type="button"
            data-preset="binge"
            data-i18n="presetBinge"
            data-i18n-tooltip="presetBingeDescription"
          >
            Binge / TV
          </button>
          <button
            type="button"
            data-preset="saver"
            data-i18n="presetSaver"
            data-i18n-tooltip="presetSaverDescription"
          >
            Battery saver / meetings
          </button>
        </div>
        <p id="presetStatus" role="status" aria-live="polite"></p>
      </section>
      <section id="hotkeys">
        <h2 data-i18n="hotkeys">Hotkeys</h2>
        <div id="hotkeyList"></div>
      </section>
      <div class="actions">
        <button id="openSettings" type="button" data-i18n="onboardingOptions">
          Open settings
        </button>
      </div>
    </main>
    <script src="settings.js"></script>
    <script src="presets.js"></script>
    <script src="tooltips.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
