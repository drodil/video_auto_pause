<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Video Auto Pause</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1f2937;
        background: #f3f4f6;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(680px, calc(100% - 32px));
        padding: 32px;
        border-radius: 16px;
        background: white;
        box-shadow: 0 12px 40px #1118271c;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 28px;
      }

      .intro,
      .pin-prompt {
        color: #4b5563;
        line-height: 1.6;
      }

      .behaviors {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
        margin: 24px 0;
      }

      .behavior {
        padding: 16px;
        border: 1px solid #e5e7eb;
        border-radius: 10px;
        animation: arrive 600ms ease both;
      }

      .behavior:nth-child(2) {
        animation-delay: 150ms;
      }

      .behavior:nth-child(3) {
        animation-delay: 300ms;
      }

      .behavior img {
        display: block;
        width: 32px;
        margin-bottom: 12px;
      }

      .behavior p {
        margin: 0;
        line-height: 1.4;
      }

      .pin-prompt {
        padding: 12px 16px;
        border-radius: 8px;
        background: #eef2ff;
      }

      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 24px;
      }

      .onboarding-presets {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      button {
        border: 0;
        border-radius: 8px;
        padding: 10px 16px;
        background: #5b5bd6;
        color: white;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #a5b4fc;
        outline-offset: 2px;
      }

      #hotkeys {
        margin-top: 24px;
        border-top: 1px solid #e5e7eb;
        padding-top: 12px;
      }

      #hotkeys h2 {
        font-size: 16px;
      }

      #hotkeys p {
        margin: 6px 0;
        color: #4b5563;
      }

      @keyframes arrive {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
        }
      }

      @media (max-width: 560px) {
        main {
          padding: 24px 18px;
        }

        .behaviors {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 data-i18n="onboardingTitle">Welcome to Video Auto Pause</h1>
      <p class="intro" data-i18n="onboardingIntro">
        Videos pause when you leave a tab or lock your device, then resume when
        you return.
      </p>
      <section class="behaviors" aria-label="What the extension does">
        <article class="behavior">
          <img src="images/icon_32.png" alt="" />
          <p data-i18n="autopause">Pause video when switching tabs</p>
        </article>
        <article class="behavior">
          <img src="images/icon_32.png" alt="" />
          <p data-i18n="scrollpause">Pause video when scrolled out of view</p>
        </article>
        <article class="behavior">
          <img src="images/icon_32.png" alt="" />
          <p data-i18n="lockpause">Pause video when computer is locked</p>
        </article>
      </section>
      <p class="pin-prompt" data-i18n="onboardingPin">
        Pin the extension to your toolbar for quick access.
      </p>
      <section>
        <h2 data-i18n="presetTitle">Choose a mode</h2>
        <div class="onboarding-presets">
          <button
            type="button"
            data-preset="study"
            data-i18n="presetStudy"
            data-i18n-title="presetStudyDescription"
            aria-describedby="presetStudyDescription"
          >
            Study / lectures
          </button>
          <button
            type="button"
            data-preset="music"
            data-i18n="presetMusic"
            data-i18n-title="presetMusicDescription"
            aria-describedby="presetMusicDescription"
          >
            Background music
          </button>
          <button
            type="button"
            data-preset="binge"
            data-i18n="presetBinge"
            data-i18n-title="presetBingeDescription"
            aria-describedby="presetBingeDescription"
          >
            Binge / TV
          </button>
          <button
            type="button"
            data-preset="saver"
            data-i18n="presetSaver"
            data-i18n-title="presetSaverDescription"
            aria-describedby="presetSaverDescription"
          >
            Battery saver / meetings
          </button>
        </div>
        <span
          class="sr-only"
          id="presetStudyDescription"
          data-i18n="presetStudyDescription"
        ></span>
        <span
          class="sr-only"
          id="presetMusicDescription"
          data-i18n="presetMusicDescription"
        ></span>
        <span
          class="sr-only"
          id="presetBingeDescription"
          data-i18n="presetBingeDescription"
        ></span>
        <span
          class="sr-only"
          id="presetSaverDescription"
          data-i18n="presetSaverDescription"
        ></span>
        <p id="presetStatus" role="status" aria-live="polite"></p>
      </section>
      <section id="hotkeys">
        <h2 data-i18n="hotkeys">Hotkeys</h2>
        <div id="hotkeyList"></div>
      </section>
      <div class="actions">
        <button id="openSettings" type="button" data-i18n="onboardingOptions">
          Open settings
        </button>
      </div>
    </main>
    <script src="presets.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
